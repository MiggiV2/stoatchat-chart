name: Build Helm Chart

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Helm dependency update
        run: helm dependency update charts/stoatchat

      - name: Helm lint
        run: helm lint charts/stoatchat

      - name: Helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          helm unittest charts/stoatchat

      - name: Helm template
        run: helm template stoatchat charts/stoatchat > /tmp/stoatchat-rendered.yaml

      - name: Helm package
        run: |
          mkdir -p dist
          helm package charts/stoatchat --destination dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: stoatchat-chart
          path: dist/*.tgz

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if chart version already published
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="$(awk '/^version:/ { gsub(/["'"'"']/, "", $2); print $2; exit }' charts/stoatchat/Chart.yaml)"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if helm show chart "oci://ghcr.io/${OWNER_LC}/charts/stoatchat" --version "${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::stoatchat ${VERSION} already published — skipping push. Bump charts/stoatchat/Chart.yaml version to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push chart to OCI registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        run: |
          helm push dist/*.tgz "oci://ghcr.io/${{ steps.published.outputs.owner_lc }}/charts"
